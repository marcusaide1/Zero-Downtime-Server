name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Triggers whenever you push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: marcusaide
          password: UhCBBNbDPQTDrxLZXKLyC2bEI8quCHc4nCjPDMdW

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          # Replace 'your-username/much-to-do-app' with your actual Docker image name
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/much-to-do-app:latest

  deploy-to-aws:
    needs: build-and-push # Only runs if the build succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access_key_id: AKIA2MJRZ7D2X55XX76S
          aws-secret_access_key: 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
          aws-region: us-east-1

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name zero-downtime-asg \
            --preferences '{"MinHealthyPercentage": 50}'

